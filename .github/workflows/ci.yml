name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Also deploy to Cloudflare"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run typecheck
      - run: pnpm -r run test
      - run: pnpm -r run build

  deploy:
    needs: build
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cursor/mvp-build-4bd7'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Provision + deploy Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          ENGINE_API_SECRET: ${{ secrets.ENGINE_API_SECRET }}
        run: |
          chmod +x scripts/cf-deploy.sh
          ./scripts/cf-deploy.sh
      - name: Print deployment hints
        run: |
          echo "Check Cloudflare dashboard → Workers for ancu-property-web and ancu-floorplan-engine"
          echo "Smoke: WEB_BASE_URL=https://<web>.workers.dev ENGINE_BASE_URL=https://<engine>.workers.dev pnpm smoke"
