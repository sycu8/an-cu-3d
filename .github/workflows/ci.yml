name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run typecheck
      - run: pnpm -r run test
      - run: pnpm -r run build

  # Deploy jobs (manual/protected): use secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
  # Do not embed account IDs or tokens in the repository.
